<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Carrito</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">

<style>
body {
  font-family:'Poppins', sans-serif;
  margin:0;
  background:#f5f5f5;
}

/* HEADER */
header {
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:20px 40px;
  background:white;
  border-bottom:1px solid #eee;
}

/* NAV */
nav a {
  margin:0 10px;
  text-decoration:none;
  color:black;
  font-size:14px;
}

/* CONTENEDOR */
.container {
  max-width:800px;
  margin:auto;
  padding:20px;
}

/* ITEM */
.item {
  background:white;
  padding:15px;
  margin-bottom:10px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  border-radius:10px;
}

/* ELIMINAR */
.remove {
  background:black;
  color:white;
  border:none;
  padding:5px 10px;
  cursor:pointer;
}

/* TOTAL */
.total {
  font-size:20px;
  margin:20px 0;
}

/* BOTON */
.btn {
  display:inline-block;
  padding:10px 15px;
  background:black;
  color:white;
  text-decoration:none;
  margin-top:10px;
}

.empty {
  text-align:center;
  margin-top:40px;
  color:#777;
}
</style>
</head>

<body>

<header>

  <!-- VOLVER -->
  <a href="index.html">← Inicio</a>

  <!-- NAV -->
  <nav>
    <a href="index.html#novedades">Novedades</a>
    <a href="index.html#vendidos">Más vendidos</a>
  </nav>

  <div>🛒</div>

</header>

<div class="container">

<h2>Tu carrito</h2>

<div id="lista"></div>

<div class="total">
Total: $<span id="total">0</span>
</div>

<a class="btn" href="index.html">Seguir comprando</a>

</div>

<script>
let cart = JSON.parse(localStorage.getItem("cart")) || [];

function render(){
  let total=0;
  let lista=document.getElementById("lista");
  lista.innerHTML="";

  if(cart.length===0){
    lista.innerHTML="<div class='empty'>Tu carrito está vacío</div>";
  }

  cart.forEach((item,i)=>{
    total+=item.precio*item.cantidad;

    lista.innerHTML+=`
    <div class="item">
      <div>
        ${item.nombre}<br>
        Color: ${item.color}<br>
        Cant: ${item.cantidad}
      </div>

      <div>$${item.precio*item.cantidad}</div>

      <button class="remove" onclick="del(${i})">X</button>
    </div>
    `;
  });

  document.getElementById("total").innerText=total;
  localStorage.setItem("cart",JSON.stringify(cart));
}

function del(i){
  cart.splice(i,1);
  render();
}

render();
</script>

</body>
</html>
