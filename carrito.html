<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Carrito</title>

<style>
body {font-family:'Poppins', sans-serif; max-width:700px; margin:auto; padding:40px;}
.item {display:flex; justify-content:space-between; margin:10px 0;}
.remove {cursor:pointer; color:#999;}

input {width:100%; padding:10px; margin:10px 0;}

button {
  width:100%;
  padding:15px;
  background:black;
  color:white;
  border:none;
}

a {text-decoration:none;}
</style>
</head>

<body>

<a href="index.html">← Volver</a>

<h1>Tu carrito</h1>

<div id="lista"></div>

<h2>Total: $<span id="total">0</span></h2>

<h3>Datos</h3>
<input id="nombre" placeholder="Nombre">
<input id="direccion" placeholder="Dirección">

<button onclick="comprar()">Finalizar compra</button>

<script>
let cart = JSON.parse(localStorage.getItem("cart")) || [];

function render(){
  let lista = document.getElementById("lista");
  let total = 0;
  lista.innerHTML = "";

  cart.forEach((item, i) => {
    let subtotal = item.precio * item.cantidad;

    lista.innerHTML += `
      <div class="item">
        <div>
          <b>${item.nombre}</b><br>
          Color: ${item.color}<br>
          Cantidad: ${item.cantidad}
        </div>
        <div>
          $${subtotal}
          <span class="remove" onclick="removeItem(${i})"> x</span>
        </div>
      </div>
    `;

    total += subtotal;
  });

  document.getElementById("total").innerText = total;
}

function removeItem(i){
  cart.splice(i,1);
  localStorage.setItem("cart", JSON.stringify(cart));
  render();
}

function comprar(){
  let nombre = document.getElementById("nombre").value;
  let direccion = document.getElementById("direccion").value;

  let mensaje = "Pedido:%0A%0A";
  mensaje += "Nombre: " + nombre + "%0A";
  mensaje += "Dirección: " + direccion + "%0A%0A";

  cart.forEach(item => {
    mensaje += `- ${item.nombre} (${item.color}) x${item.cantidad}%0A`;
  });

  let total = cart.reduce((sum,i)=>sum + (i.precio * i.cantidad),0);
  mensaje += `%0ATotal: $${total}`;

  let numero = "1168522582";
  window.open(`https://wa.me/${numero}?text=${mensaje}`);
}

render();
</script>

</body>
</html>
