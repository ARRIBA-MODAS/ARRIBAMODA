<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Carrito</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">

<style>
* { box-sizing: border-box; }

body {
  font-family:'Poppins', sans-serif;
  margin:0;
  background:#f5f5f5;
}

/* HEADER */
header {
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:20px 40px;
  background:white;
  border-bottom:1px solid #eee;
}

a {
  text-decoration:none;
  color:black;
}

/* CONTENEDOR */
.container {
  max-width:800px;
  margin:auto;
  padding:20px;
}

/* ITEM */
.item {
  background:white;
  padding:15px;
  margin-bottom:10px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  border-radius:10px;
}

/* ELIMINAR */
.remove {
  background:black;
  color:white;
  border:none;
  padding:5px 10px;
  cursor:pointer;
}

/* TOTAL */
.total {
  font-size:20px;
  margin:20px 0;
}

/* AVISOS */
.alert {
  background:white;
  border-left:4px solid black;
  padding:12px 15px;
  margin:15px 0;
  font-size:14px;
}

/* BOTON */
.btn {
  display:block;
  width:100%;
  padding:15px;
  background:black;
  color:white;
  text-align:center;
  border:none;
  cursor:pointer;
  margin-top:10px;
}

.btn:disabled {
  background:#aaa;
  cursor:not-allowed;
}

.empty {
  text-align:center;
  margin-top:40px;
  color:#777;
}
</style>
</head>

<body>

<header>
  <a href="index.html">← Inicio</a>
  <div>Tu carrito</div>
</header>

<div class="container">

<h2>Tu carrito</h2>

<!-- ⚠️ AVISOS -->
<div class="alert">
Compra mínima: 3 unidades
</div>

<div class="alert">
Compra mínima para envíos: $40.000
</div>

<div id="lista"></div>

<div class="total">
Total: $<span id="total">0</span>
</div>

<button class="btn" id="comprarBtn" onclick="enviar()">Finalizar por WhatsApp</button>

<a class="btn" href="index.html">Seguir comprando</a>

</div>

<script>
let cart = JSON.parse(localStorage.getItem("cart")) || [];

function render(){
  let total = 0;
  let unidades = 0;
  let lista = document.getElementById("lista");

  lista.innerHTML = "";

  if(cart.length === 0){
    lista.innerHTML = "<div class='empty'>Tu carrito está vacío</div>";
  }

  cart.forEach((item,i)=>{
    total += item.precio * item.cantidad;
    unidades += item.cantidad;

    lista.innerHTML += `
    <div class="item">
      <div>
        ${item.nombre}<br>
        Color: ${item.color}<br>
        Cant: ${item.cantidad}
      </div>

      <div>$${item.precio * item.cantidad}</div>

      <button class="remove" onclick="del(${i})">X</button>
    </div>
    `;
  });

  document.getElementById("total").innerText = total;

  /* 🔒 BLOQUEO BOTON */
  let btn = document.getElementById("comprarBtn");
  btn.disabled = unidades < 3;

  localStorage.setItem("cart", JSON.stringify(cart));
}

function del(i){
  cart.splice(i,1);
  render();
}

function enviar(){
  let total = 0;
  let unidades = 0;

  cart.forEach(item=>{
    total += item.precio * item.cantidad;
    unidades += item.cantidad;
  });

  /* 🚫 BLOQUEO REAL */
  if(unidades < 3){
    alert("Debés comprar mínimo 3 unidades");
    return;
  }

  let mensaje="Pedido:%0A";

  cart.forEach(item=>{
    mensaje+=`${item.nombre} (${item.color}) x${item.cantidad}%0A`;
  });

  mensaje+=`%0ATotal: $${total}`;

  window.open(`https://wa.me/549XXXXXXXXXX?text=${mensaje}`);
}

render();
</script>

</body>
</html>
