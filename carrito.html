<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Carrito</title>

<style>
body {font-family:sans-serif;background:#f5f5f5;margin:0;}

.container {max-width:800px;margin:auto;padding:20px;}

.item {
background:white;
padding:15px;
margin-bottom:10px;
display:flex;
justify-content:space-between;
}

.total {
font-size:20px;
margin:20px 0;
}
</style>
</head>

<body>

<div class="container">

<h2>Tu carrito</h2>

<div id="lista"></div>

<div class="total">
Total: $<span id="total">0</span>
</div>

<button onclick="enviar()">Comprar por WhatsApp</button>

</div>

<script>
let cart = JSON.parse(localStorage.getItem("cart")) || [];
let total = 0;

cart.forEach(item=>{
total += item.precio * item.cantidad;

document.getElementById("lista").innerHTML += `
<div class="item">
<div>
${item.nombre}<br>
Color: ${item.color}<br>
Cantidad: ${item.cantidad}
</div>
<div>$${item.precio * item.cantidad}</div>
</div>
`;
});

document.getElementById("total").innerText = total;

function enviar(){
let mensaje="Pedido:%0A";

cart.forEach(item=>{
mensaje+=`${item.nombre} x${item.cantidad}%0A`;
});

window.open(`https://wa.me/549XXXXXXXXXX?text=${mensaje}`);
}
</script>

</body>
</html>
