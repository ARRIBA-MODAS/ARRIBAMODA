<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Carrito</title>

<style>
body {font-family:sans-serif;background:#f5f5f5;}

.container {max-width:800px;margin:auto;padding:20px;}

.item {
background:white;
padding:15px;
margin-bottom:10px;
display:flex;
justify-content:space-between;
align-items:center;
}

.remove {
background:black;
color:white;
border:none;
cursor:pointer;
padding:5px 10px;
}
</style>
</head>

<body>

<div class="container">

<h2>Tu carrito</h2>

<div id="lista"></div>

<div>Total: $<span id="total">0</span></div>

</div>

<script>
let cart = JSON.parse(localStorage.getItem("cart")) || [];

function render(){
let total=0;
let lista=document.getElementById("lista");
lista.innerHTML="";

cart.forEach((item,i)=>{
total+=item.precio*item.cantidad;

lista.innerHTML+=`
<div class="item">
<div>
${item.nombre}<br>
Color: ${item.color}<br>
Cant: ${item.cantidad}
</div>

<div>$${item.precio*item.cantidad}</div>

<button class="remove" onclick="del(${i})">X</button>
</div>
`;
});

document.getElementById("total").innerText=total;
localStorage.setItem("cart",JSON.stringify(cart));
}

function del(i){
cart.splice(i,1);
render();
}

render();
</script>

</body>
</html>
