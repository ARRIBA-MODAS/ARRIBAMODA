<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carrito</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">

<style>
body {
  font-family:'Poppins', sans-serif;
  margin:0;
  background:#f5f5f5;
  color:#111;
}

/* HEADER */
header {
  padding:20px;
  background:white;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

a {
  text-decoration:none;
  color:black;
}

/* CONTENEDOR */
.container {
  max-width:900px;
  margin:auto;
  padding:20px;
}

/* ITEM */
.item {
  background:white;
  padding:15px;
  margin-bottom:15px;
  border-radius:10px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.info {
  font-size:14px;
}

/* CANTIDAD */
.qty {
  display:flex;
  align-items:center;
  gap:8px;
}

.qty button {
  width:28px;
  height:28px;
  border:none;
  background:#eee;
  cursor:pointer;
}

.qty span {
  min-width:20px;
  text-align:center;
}

/* BOTON ELIMINAR */
.remove {
  background:red;
  color:white;
  border:none;
  padding:6px 10px;
  cursor:pointer;
}

/* TOTAL */
.total {
  font-size:22px;
  margin:20px 0;
}

/* FORM */
input {
  width:100%;
  padding:12px;
  margin:10px 0;
  border:1px solid #ddd;
}

/* BOTON FINAL */
button.final {
  width:100%;
  padding:15px;
  background:black;
  color:white;
  border:none;
  cursor:pointer;
}

.empty {
  text-align:center;
  margin-top:50px;
  color:#777;
}
</style>
</head>

<body>

<header>
  <a href="index.html">← Volver</a>
  <div>🛒 Tu carrito</div>
</header>

<div class="container">

<div id="lista"></div>

<div class="total">
Total: $<span id="total">0</span>
</div>

<h3>Datos</h3>

<input type="text" id="nombre" placeholder="Nombre">
<input type="text" id="direccion" placeholder="Dirección">

<button class="final" onclick="enviar()">Finalizar por WhatsApp</button>

</div>

<script>
let cart = JSON.parse(localStorage.getItem("cart")) || [];

function render(){
  let lista = document.getElementById("lista");
  let total = 0;
  lista.innerHTML = "";

  if(cart.length === 0){
    lista.innerHTML = "<div class='empty'>Tu carrito está vacío</div>";
    document.getElementById("total").innerText = 0;
    return;
  }

  cart.forEach((item, i) => {
    total += item.precio * item.cantidad;

    lista.innerHTML += `
      <div class="item">
        <div class="info">
          <strong>${item.nombre}</strong><br>
          Color: ${item.color}
        </div>

        <div class="qty">
          <button onclick="cambiar(${i},-1)">-</button>
          <span>${item.cantidad}</span>
          <button onclick="cambiar(${i},1)">+</button>
        </div>

        <div>$${item.precio * item.cantidad}</div>

        <button class="remove" onclick="eliminar(${i})">X</button>
      </div>
    `;
  });

  document.getElementById("total").innerText = total;
  localStorage.setItem("cart", JSON.stringify(cart));
}

function cambiar(i,val){
  cart[i].cantidad += val;
  if(cart[i].cantidad < 1) cart[i].cantidad = 1;
  if(cart[i].cantidad > 5) cart[i].cantidad = 5;
  render();
}

function eliminar(i){
  cart.splice(i,1);
  render();
}

function enviar(){
  let nombre = document.getElementById("nombre").value;
  let direccion = document.getElementById("direccion").value;

  if(cart.length === 0){
    alert("El carrito está vacío");
    return;
  }

  let mensaje = "Pedido:%0A";

  cart.forEach(item => {
    mensaje += `- ${item.nombre} (${item.color}) x${item.cantidad}%0A`;
  });

  mensaje += `%0ATotal: $${document.getElementById("total").innerText}%0A`;
  mensaje += `Nombre: ${nombre}%0A`;
  mensaje += `Dirección: ${direccion}`;

  let telefono = "549XXXXXXXXXX"; // CAMBIAR

  window.open(`https://wa.me/${telefono}?text=${mensaje}`);
}

render();
</script>

</body>
</html>
