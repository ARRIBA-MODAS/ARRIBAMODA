<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARRIBA MODA</title>

<style>
body {margin:0;font-family:'Helvetica Neue', Arial;background:#fafafa;color:#111;}

header {
  display:flex;
  justify-content:space-between;
  padding:20px 40px;
  background:white;
  position:sticky;
  top:0;
}

.logo {letter-spacing:4px;}
.cart {cursor:pointer;}

.banner {
  height:70vh;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#eae7e1;
  font-size:50px;
  letter-spacing:5px;
}

.section {padding:60px 20px;}
.section h2 {text-align:center;margin-bottom:40px;font-weight:300;}

.grid {
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:30px;
  max-width:1100px;
  margin:auto;
}

.card {
  background:white;
  padding:30px;
  text-align:center;
  transition:0.3s;
}

.card:hover {transform:translateY(-10px);}

button {
  margin-top:10px;
  padding:10px 25px;
  border:none;
  background:black;
  color:white;
  cursor:pointer;
}

/* FOOTER */
footer {
  background:white;
  padding:40px;
  text-align:center;
  margin-top:60px;
}

iframe {
  width:100%;
  height:250px;
  border:none;
  border-radius:10px;
}

@media(max-width:768px){
  .grid {grid-template-columns:1fr;}
}
</style>
</head>

<body>

<header>
  <div class="logo">ARRIBA MODA</div>
  <div class="cart" onclick="irCarrito()">🛒 (<span id="count">0</span>)</div>
</header>

<div class="banner">Own Your Style</div>

<!-- NOVEDADES -->
<div class="section">
<h2>NOVEDADES</h2>
<div class="grid">

<div class="card"><h3>Vestido Arena</h3><p>$15000</p><button onclick="add('Vestido Arena',15000)">Agregar</button></div>
<div class="card"><h3>Top Blanco</h3><p>$9000</p><button onclick="add('Top Blanco',9000)">Agregar</button></div>
<div class="card"><h3>Blazer Nude</h3><p>$25000</p><button onclick="add('Blazer Nude',25000)">Agregar</button></div>

</div>
</div>

<!-- MÁS VENDIDOS -->
<div class="section">
<h2>MÁS VENDIDOS</h2>
<div class="grid">

<div class="card"><h3>Vestido Negro</h3><p>$17000</p><button onclick="add('Vestido Negro',17000)">Agregar</button></div>
<div class="card"><h3>Pantalón Sastrero</h3><p>$18000</p><button onclick="add('Pantalón Sastrero',18000)">Agregar</button></div>
<div class="card"><h3>Conjunto Beige</h3><p>$20000</p><button onclick="add('Conjunto Beige',20000)">Agregar</button></div>

</div>
</div>

<!-- FOOTER -->
<footer>
<h3>Visitános</h3>
<p>Concordia 525</p>

<iframe src="https://www.google.com/maps?q=Concordia+525&output=embed"></iframe>

<p style="margin-top:20px;">© 2026 ARRIBA MODA</p>
</footer>

<script>
let cart = JSON.parse(localStorage.getItem("cart")) || [];

function updateCount(){
  document.getElementById("count").innerText = cart.length;
}

function add(nombre, precio){
  cart.push({nombre, precio});
  localStorage.setItem("cart", JSON.stringify(cart));
  updateCount();
}

function irCarrito(){
  window.location.href = "carrito.html";
}

updateCount();
</script>

</body>
</html>
