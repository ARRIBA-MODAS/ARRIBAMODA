<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARRIBA MODA</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">

<style>
body {margin:0;font-family:'Poppins', sans-serif;background:#fafafa;color:#111;}

header {
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:20px 40px;
  background:white;
  position:sticky;
  top:0;
}

nav a {margin:0 10px;text-decoration:none;color:#111;font-size:14px;}
.cart {cursor:pointer;}

.banner {
  height:60vh;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#eae7e1;
  font-size:40px;
}

.section {padding:60px 20px;}
.section h2 {text-align:center;margin-bottom:40px;font-weight:300;}

.grid {
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:30px;
  max-width:1100px;
  margin:auto;
}

.card {
  background:white;
  padding:20px;
  text-align:center;
  transition:0.3s;
}
.card:hover {transform:translateY(-8px);}

select, input {
  width:100%;
  padding:8px;
  margin:5px 0;
  border:1px solid #ddd;
}

button {
  margin-top:10px;
  padding:10px;
  border:none;
  background:black;
  color:white;
  cursor:pointer;
}

/* TOAST FIX REAL */
#toast {
  position: fixed;
  top: 70px;
  right: 20px;
  background: white;
  padding: 15px 20px;
  border-radius: 10px;
  box-shadow: 0 5px 20px rgba(0,0,0,0.1);
  font-size: 14px;
  opacity: 0;
  transform: translateY(-20px);
  transition: 0.4s;
  z-index: -1; /* 👈 CLAVE */
}

#toast.show {
  opacity: 1;
  transform: translateY(0);
  z-index: 999;
}

footer {
  background:white;
  padding:40px;
  text-align:center;
  margin-top:60px;
}

iframe {
  width:100%;
  height:250px;
  border:none;
  border-radius:10px;
}

@media(max-width:768px){
  .grid {grid-template-columns:1fr;}
}
</style>
</head>

<body>

<header>
  <div>ARRIBA MODA</div>

  <nav>
    <a href="#novedades">Novedades</a>
    <a href="#vendidos">Más vendidos</a>
  </nav>

  <div class="cart" onclick="irCarrito()">🛒 (<span id="count">0</span>)</div>
</header>

<div class="banner">Own Your Style</div>

<!-- NOVEDADES -->
<div class="section" id="novedades">
<h2>NOVEDADES</h2>
<div class="grid">

<div class="card">
<h3>Vestido Arena</h3><p>$15000</p>
<select id="c1"><option>Negro</option><option>Blanco</option><option>Gris</option></select>
<input type="number" id="q1" min="1" max="5" value="1">
<button onclick="add('Vestido Arena',15000,'c1','q1')">Agregar</button>
</div>

<div class="card">
<h3>Top Blanco</h3><p>$9000</p>
<select id="c2"><option>Negro</option><option>Blanco</option><option>Gris</option></select>
<input type="number" id="q2" min="1" max="5" value="1">
<button onclick="add('Top Blanco',9000,'c2','q2')">Agregar</button>
</div>

<div class="card">
<h3>Blazer Nude</h3><p>$25000</p>
<select id="c3"><option>Negro</option><option>Blanco</option><option>Gris</option></select>
<input type="number" id="q3" min="1" max="5" value="1">
<button onclick="add('Blazer Nude',25000,'c3','q3')">Agregar</button>
</div>

</div>
</div>

<!-- MÁS VENDIDOS -->
<div class="section" id="vendidos">
<h2>MÁS VENDIDOS</h2>
<div class="grid">

<div class="card">
<h3>Vestido Negro</h3><p>$17000</p>
<select id="c4"><option>Negro</option><option>Blanco</option><option>Gris</option></select>
<input type="number" id="q4" min="1" max="5" value="1">
<button onclick="add('Vestido Negro',17000,'c4','q4')">Agregar</button>
</div>

<div class="card">
<h3>Pantalón Sastrero</h3><p>$18000</p>
<select id="c5"><option>Negro</option><option>Blanco</option><option>Gris</option></select>
<input type="number" id="q5" min="1" max="5" value="1">
<button onclick="add('Pantalón Sastrero',18000,'c5','q5')">Agregar</button>
</div>

<div class="card">
<h3>Conjunto Beige</h3><p>$20000</p>
<select id="c6"><option>Negro</option><option>Blanco</option><option>Gris</option></select>
<input type="number" id="q6" min="1" max="5" value="1">
<button onclick="add('Conjunto Beige',20000,'c6','q6')">Agregar</button>
</div>

</div>
</div>

<!-- FOOTER -->
<footer>
<h3>Visitános</h3>
<p>Concordia 525</p>
<iframe src="https://www.google.com/maps?q=Concordia+525&output=embed"></iframe>
</footer>

<div id="toast"></div>

<script>
let cart = JSON.parse(localStorage.getItem("cart")) || [];

function updateCount(){
  document.getElementById("count").innerText = cart.length;
}

function add(nombre, precio, cId, qId){
  let color = document.getElementById(cId).value;
  let cantidad = parseInt(document.getElementById(qId).value);

  cart.push({nombre, precio, color, cantidad});
  localStorage.setItem("cart", JSON.stringify(cart));
  updateCount();

  let t = document.getElementById("toast");
  t.innerHTML = `✔ ${nombre}<br>Color: ${color} | Cant: ${cantidad}`;
  t.classList.add("show");

  setTimeout(()=>{t.classList.remove("show");},1800);
}

function irCarrito(){
  window.location.href = "carrito.html";
}

updateCount();
</script>

</body>
</html>
