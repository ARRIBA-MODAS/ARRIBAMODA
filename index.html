<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARRIBA MODA</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Poppins:wght@300;400&display=swap" rel="stylesheet">

<style>

/* 🔥 FIX GLOBAL */
* { box-sizing: border-box; }
html, body { margin:0; overflow-x:hidden; font-family:'Poppins',sans-serif; background:#f5f5f5; }

/* HEADER */
header {
  position:absolute;
  width:100%;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:20px 40px;
  color:white;
  z-index:3;
}

/* NAV */
nav a {
  margin:0 10px;
  color:white;
  text-decoration:none;
  font-size:14px;
}

/* 🛒 ICONO */
.cart {
  position:relative;
  cursor:pointer;
}

.cart svg {
  width:24px;
  height:24px;
  stroke:white;
}

.cart-count {
  position:absolute;
  top:-6px;
  right:-8px;
  background:white;
  color:black;
  font-size:10px;
  padding:2px 6px;
  border-radius:50%;
}

/* 🔔 NOTIF (FIX COLOR NEGRO) */
#notif {
  position:absolute;
  top:70px;
  right:40px;
  background:white;
  color:black; /* 👈 FIX */
  padding:12px 16px;
  border-radius:12px;
  box-shadow:0 10px 30px rgba(0,0,0,0.1);
  font-size:13px;
  opacity:0;
  transform:translateY(-10px);
  transition:0.3s;
}

#notif.show {
  opacity:1;
  transform:translateY(0);
}

#notif strong {
  font-weight:500;
  display:block;
  margin-bottom:3px;
}

/* 🖤 BANNER PRO */
.banner {
  height:90vh;
  display:flex;
  align-items:center;
  position:relative;
  overflow:hidden;
}

.banner::after {
  content:"";
  position:absolute;
  inset:0;
  background: url('banner.jpg') right center no-repeat;
  background-size:cover;
  filter: brightness(0.6) blur(1px);
  z-index:0;
}

.banner::before {
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(to right, rgba(0,0,0,0.85), transparent);
  z-index:1;
}

.banner-text {
  position:relative;
  z-index:2;
  color:white;
  padding-left:60px;
}

.banner-text h1 {
  font-family:'Playfair Display', serif;
  font-size:80px;
  line-height:0.9;
}

/* SECCIONES */
.section { padding:60px 20px; }

.section h2 {
  text-align:center;
  margin-bottom:40px;
  font-weight:300;
}

/* GRID */
.grid {
  width:100%;
  max-width:1100px;
  margin:auto;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:30px;
}

/* CARD */
.card {
  background:white;
  padding:15px;
  border-radius:12px;
  text-align:center;
}

/* COLORES */
.colors {display:flex;justify-content:center;gap:10px;margin:10px 0;}
.color {width:18px;height:18px;border-radius:50%;cursor:pointer;border:2px solid transparent;}
.negro{background:black;}
.blanco{background:white;border:1px solid #ccc;}
.gris{background:gray;}
.active{border:2px solid black;}

/* CANTIDAD */
.qty {display:flex;justify-content:center;gap:10px;}
.qty button {width:28px;height:28px;border:none;background:#eee;}

/* BOTON */
button {padding:10px;background:black;color:white;border:none;cursor:pointer;}

/* RESPONSIVE */
@media(max-width:768px){
  .grid {grid-template-columns:1fr;}
  .banner-text h1 {font-size:50px;}
  header {padding:20px;}
}

</style>
</head>

<body>

<header>
  <div>ARRIBA MODA</div>

  <nav>
    <a href="#novedades">Novedades</a>
    <a href="#vendidos">Más vendidos</a>
  </nav>

  <div class="cart" onclick="irCarrito()">
    <svg fill="none" stroke-width="2" viewBox="0 0 24 24">
      <path d="M6 6h15l-1.5 9h-13z"/>
      <circle cx="9" cy="20" r="1"/>
      <circle cx="18" cy="20" r="1"/>
    </svg>
    <div class="cart-count" id="count">0</div>
  </div>

  <div id="notif"></div>
</header>

<!-- BANNER -->
<div class="banner">
  <div class="banner-text">
    <h1>OWN<br>YOUR<br>STYLE</h1>
  </div>
</div>

<!-- NOVEDADES -->
<div class="section" id="novedades">
<h2>NOVEDADES</h2>

<div class="grid">

<div class="card">
<h3>Manga Globo Rayado Darlon</h3>
<p>$9.900</p>

<div class="colors" id="c1">
<div class="color negro active" onclick="sel(this,'c1')"></div>
<div class="color blanco" onclick="sel(this,'c1')"></div>
<div class="color gris" onclick="sel(this,'c1')"></div>
</div>

<div class="qty">
<button onclick="q('q1',-1)">-</button>
<span id="q1">1</span>
<button onclick="q('q1',1)">+</button>
</div>

<button onclick="add('Manga Globo Rayado Darlon',9.900,'c1','q1')">Agregar</button>
</div>

</div>
</div>

<!-- MÁS VENDIDOS -->
<div class="section" id="vendidos">
<h2>MÁS VENDIDOS</h2>

<div class="grid">
<div class="card"></div>
<div class="card"></div>
<div class="card"></div>
</div>
</div>

<script>
let cart = JSON.parse(localStorage.getItem("cart")) || [];

function update(){
  document.getElementById("count").innerText = cart.length;
}

function sel(el,id){
  document.querySelectorAll(`#${id} .color`).forEach(c=>c.classList.remove("active"));
  el.classList.add("active");
}

function q(id,v){
  let e=document.getElementById(id);
  let n=parseInt(e.innerText);
  n+=v;
  if(n<1)n=1;
  if(n>5)n=5;
  e.innerText=n;
}

function add(n,p,cid,qid){
  let cantidad = parseInt(document.getElementById(qid).innerText);

  let colorEl = document.querySelector(`#${cid} .active`);
  let color = colorEl.classList.contains("negro") ? "Negro" :
              colorEl.classList.contains("blanco") ? "Blanco" :
              "Gris";

  cart.push({nombre:n,precio:p,color,cantidad});
  localStorage.setItem("cart",JSON.stringify(cart));
  update();

  let notif = document.getElementById("notif");
  notif.innerHTML = `
    <strong>${n}</strong>
    ${color} · x${cantidad}
  `;
  notif.classList.add("show");

  setTimeout(()=>{
    notif.classList.remove("show");
  },2000);
}

function irCarrito(){
  window.location.href="carrito.html";
}

update();
</script>

</body>
</html>
