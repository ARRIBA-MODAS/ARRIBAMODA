<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARRIBA MODA</title>

<style>
body {
  margin:0;
  font-family:'Helvetica Neue', Arial;
  background:#fafafa;
  color:#111;
}

/* HEADER */
header {
  display:flex;
  justify-content:space-between;
  padding:20px 40px;
  background:white;
  position:sticky;
  top:0;
}

.logo {
  letter-spacing:4px;
  font-weight:300;
}

.cart {
  cursor:pointer;
}

/* BANNER */
.banner {
  height:70vh;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#eae7e1;
  font-size:50px;
  font-weight:300;
  letter-spacing:5px;
  animation:fade 1.5s;
}

/* GRID */
.grid {
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:30px;
  max-width:1100px;
  margin:80px auto;
  padding:0 20px;
}

.card {
  background:white;
  padding:30px;
  text-align:center;
  transition:0.4s;
}

.card:hover {
  transform:translateY(-10px);
}

button {
  margin-top:10px;
  padding:10px 25px;
  border:none;
  background:black;
  color:white;
  letter-spacing:1px;
  cursor:pointer;
}

/* ANIMACIÓN */
@keyframes fade {
  from {opacity:0; transform:translateY(30px);}
  to {opacity:1; transform:translateY(0);}
}

/* RESPONSIVE */
@media(max-width:768px){
  .grid {grid-template-columns:1fr;}
}
</style>
</head>

<body>

<header>
  <div class="logo">ARRIBA MODA</div>
  <div class="cart" onclick="irCarrito()">🛒 (<span id="count">0</span>)</div>
</header>

<div class="banner">
  Own Your Style
</div>

<div class="grid">

  <div class="card">
    <h3>Vestido Arena</h3>
    <p>$15000</p>
    <button onclick="add('Vestido Arena',15000)">Agregar</button>
  </div>

  <div class="card">
    <h3>Blazer Nude</h3>
    <p>$25000</p>
    <button onclick="add('Blazer Nude',25000)">Agregar</button>
  </div>

  <div class="card">
    <h3>Top Blanco</h3>
    <p>$9000</p>
    <button onclick="add('Top Blanco',9000)">Agregar</button>
  </div>

</div>

<script>
let cart = JSON.parse(localStorage.getItem("cart")) || [];

function updateCount(){
  document.getElementById("count").innerText = cart.length;
}

function add(nombre, precio){
  cart.push({nombre, precio});
  localStorage.setItem("cart", JSON.stringify(cart));
  updateCount();
}

function irCarrito(){
  window.location.href = "carrito.html";
}

updateCount();
</script>

</body>
</html>
