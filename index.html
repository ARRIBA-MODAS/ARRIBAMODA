<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARRIBA MODA</title>

<!-- FUENTE MÁS PREMIUM -->
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Poppins:wght@300;400&display=swap" rel="stylesheet">

<style>
body {margin:0;font-family:'Poppins', sans-serif;background:#fafafa;color:#111;}

header {
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:20px 40px;
  background:white;
  position:sticky;
  top:0;
}

nav a {margin:0 10px;text-decoration:none;color:#111;font-size:14px;}
.cart {cursor:pointer;}

/* 🔥 BANNER CON TU IMAGEN */
.banner {
  height:80vh;
  display:flex;
  align-items:center;
  justify-content:center;
  background: url('banner.jpg') center/cover no-repeat;
  position:relative;
}

/* overlay oscuro elegante */
.banner::after {
  content:"";
  position:absolute;
  width:100%;
  height:100%;
  background: rgba(0,0,0,0.55);
}

/* TEXTO PREMIUM */
.banner h1 {
  position:relative;
  font-family: 'Playfair Display', serif;
  font-size:72px;
  font-weight:600;
  letter-spacing:4px;
  color:#f5f5f5;
  text-transform:uppercase;
}

/* RESTO */
.section {padding:60px 20px;}
.grid {
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:30px;
  max-width:1100px;
  margin:auto;
}

.card {
  background:white;
  padding:20px;
  text-align:center;
}

button {
  margin-top:10px;
  padding:10px;
  border:none;
  background:black;
  color:white;
}

/* COLORES */
.colors {display:flex;justify-content:center;gap:10px;margin:10px 0;}
.color {width:20px;height:20px;border-radius:50%;cursor:pointer;}
.color.negro {background:black;}
.color.blanco {background:white;border:1px solid #ccc;}
.color.gris {background:gray;}
.color.active {border:2px solid black;}

/* CANTIDAD */
.qty {display:flex;justify-content:center;gap:10px;}
.qty button {width:30px;height:30px;background:black;color:white;border:none;}
.qty span {min-width:20px;text-align:center;}

/* TOAST */
#toast {
  position: fixed;
  top: 70px;
  right: 20px;
  background: white;
  padding: 15px;
  border-radius: 10px;
  opacity: 0;
  z-index:-1;
}
#toast.show {opacity:1;z-index:999;}

footer {padding:40px;text-align:center;}
iframe {width:100%;height:250px;border:none;}

</style>
</head>

<body>

<header>
  <div>ARRIBA MODA</div>
  <nav>
    <a href="#">Novedades</a>
    <a href="#">Más vendidos</a>
  </nav>
  <div class="cart" onclick="irCarrito()">🛒 (<span id="count">0</span>)</div>
</header>

<!-- BANNER -->
<div class="banner">
  <h1>Own Your Style</h1>
</div>

<!-- PRODUCTO -->
<div class="section">
<div class="grid">

<div class="card">
<h3>Remera Morley</h3><p>$12000</p>

<div class="colors" id="c1">
  <span class="color negro active" onclick="selectColor(this,'c1')"></span>
  <span class="color blanco" onclick="selectColor(this,'c1')"></span>
  <span class="color gris" onclick="selectColor(this,'c1')"></span>
</div>

<div class="qty">
  <button onclick="changeQty('q1', -1)">−</button>
  <span id="q1">1</span>
  <button onclick="changeQty('q1', 1)">+</button>
</div>

<button onclick="add('Remera Morley',12000,'c1','q1')">Agregar</button>
</div>

</div>
</div>

<footer>
<h3>Visitános</h3>
<p>Concordia 525</p>
<iframe src="https://www.google.com/maps?q=Concordia+525&output=embed"></iframe>
</footer>

<div id="toast"></div>

<script>
let cart = JSON.parse(localStorage.getItem("cart")) || [];

function updateCount(){
  document.getElementById("count").innerText = cart.length;
}

function selectColor(el, id){
  let parent = document.getElementById(id);
  parent.querySelectorAll('.color').forEach(c => c.classList.remove('active'));
  el.classList.add('active');
}

function changeQty(id, delta){
  let el = document.getElementById(id);
  let value = parseInt(el.innerText);
  value += delta;
  if(value < 1) value = 1;
  if(value > 5) value = 5;
  el.innerText = value;
}

function add(nombre, precio, cId, qId){
  let cantidad = parseInt(document.getElementById(qId).innerText);
  let colorEl = document.querySelector(`#${cId} .active`);
  let color = colorEl ? colorEl.classList[1] : "negro";

  cart.push({nombre, precio, color, cantidad});
  localStorage.setItem("cart", JSON.stringify(cart));
  updateCount();

  let t = document.getElementById("toast");
  t.innerHTML = `✔ ${nombre}`;
  t.classList.add("show");
  setTimeout(()=>{t.classList.remove("show");},1500);
}

function irCarrito(){
  window.location.href = "carrito.html";
}

updateCount();
</script>

</body>
</html>
