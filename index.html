<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARRIBA MODA</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">

<style>
body {margin:0;font-family:'Poppins', sans-serif;background:#fafafa;color:#111;}

header {
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:20px 40px;
  background:white;
  position:sticky;
  top:0;
}

nav a {margin:0 10px;text-decoration:none;color:#111;font-size:14px;}
.cart {cursor:pointer;}

/* BANNER PREMIUM */
.banner {
  height:70vh;
  display:flex;
  align-items:center;
  justify-content:center;
  background: url('https://images.unsplash.com/photo-1520975916090-3105956dac38?q=80&w=1600&auto=format&fit=crop') center/cover no-repeat;
  position:relative;
}

.banner::after {
  content:"";
  position:absolute;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background: rgba(255,255,255,0.3);
}

.banner h1 {
  position:relative;
  font-size:48px;
  font-weight:300;
  letter-spacing:2px;
}

/* SECCIONES */
.section {padding:60px 20px;}
.section h2 {text-align:center;margin-bottom:40px;font-weight:300;}

.grid {
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:30px;
  max-width:1100px;
  margin:auto;
}

.card {
  background:white;
  padding:20px;
  text-align:center;
  transition:0.3s;
}
.card:hover {transform:translateY(-8px);}

button {
  margin-top:10px;
  padding:10px;
  border:none;
  background:black;
  color:white;
  cursor:pointer;
}

/* COLORES */
.colors {
  display:flex;
  justify-content:center;
  gap:10px;
  margin:10px 0;
}

.color {
  width:20px;
  height:20px;
  border-radius:50%;
  cursor:pointer;
  border:2px solid transparent;
}

.color.negro {background:black;}
.color.blanco {background:white; border:1px solid #ccc;}
.color.gris {background:gray;}

.color.active {
  border:2px solid black;
}

/* CANTIDAD */
.qty {
  display:flex;
  justify-content:center;
  align-items:center;
  gap:10px;
  margin:10px 0;
}

.qty button {
  width:30px;
  height:30px;
  border:none;
  background:black;
  color:white;
  cursor:pointer;
}

.qty span {
  min-width:20px;
  text-align:center;
}

/* TOAST */
#toast {
  position: fixed;
  top: 70px;
  right: 20px;
  background: white;
  padding: 15px 20px;
  border-radius: 10px;
  box-shadow: 0 5px 20px rgba(0,0,0,0.1);
  font-size: 14px;
  opacity: 0;
  transform: translateY(-20px);
  transition: 0.4s;
  z-index: -1;
}

#toast.show {
  opacity: 1;
  transform: translateY(0);
  z-index: 999;
}

/* FOOTER */
footer {
  background:white;
  padding:40px;
  text-align:center;
  margin-top:60px;
}

iframe {
  width:100%;
  height:250px;
  border:none;
  border-radius:10px;
}

@media(max-width:768px){
  .grid {grid-template-columns:1fr;}
}
</style>
</head>

<body>

<header>
  <div>ARRIBA MODA</div>

  <nav>
    <a href="#novedades">Novedades</a>
    <a href="#vendidos">Más vendidos</a>
  </nav>

  <div class="cart" onclick="irCarrito()">🛒 (<span id="count">0</span>)</div>
</header>

<!-- BANNER -->
<div class="banner">
  <h1>Own Your Style</h1>
</div>

<!-- PRODUCTO -->
<div class="section">
<div class="grid">

<div class="card">
<h3>Vestido Arena</h3><p>$15000</p>

<div class="colors" id="c1">
  <span class="color negro active" onclick="selectColor(this,'c1')"></span>
  <span class="color blanco" onclick="selectColor(this,'c1')"></span>
  <span class="color gris" onclick="selectColor(this,'c1')"></span>
</div>

<div class="qty">
  <button onclick="changeQty('q1', -1)">−</button>
  <span id="q1">1</span>
  <button onclick="changeQty('q1', 1)">+</button>
</div>

<button onclick="add('Vestido Arena',15000,'c1','q1')">Agregar</button>
</div>

</div>
</div>

<!-- FOOTER -->
<footer>
<h3>Visitános</h3>
<p>Concordia 525</p>
<iframe src="https://www.google.com/maps?q=Concordia+525&output=embed"></iframe>
</footer>

<div id="toast"></div>

<script>
let cart = JSON.parse(localStorage.getItem("cart")) || [];

function updateCount(){
  document.getElementById("count").innerText = cart.length;
}

function selectColor(el, id){
  let parent = document.getElementById(id);
  parent.querySelectorAll('.color').forEach(c => c.classList.remove('active'));
  el.classList.add('active');
}

function changeQty(id, delta){
  let el = document.getElementById(id);
  let value = parseInt(el.innerText);

  value += delta;
  if(value < 1) value = 1;
  if(value > 5) value = 5;

  el.innerText = value;
}

function add(nombre, precio, cId, qId){
  let cantidad = parseInt(document.getElementById(qId).innerText);

  let colorEl = document.querySelector(`#${cId} .active`);
  let color = colorEl ? colorEl.classList[1] : "negro";

  cart.push({nombre, precio, color, cantidad});
  localStorage.setItem("cart", JSON.stringify(cart));
  updateCount();

  let t = document.getElementById("toast");
  t.innerHTML = `✔ ${nombre}<br>Color: ${color} | Cant: ${cantidad}`;
  t.classList.add("show");

  setTimeout(()=>{t.classList.remove("show");},1800);
}

function irCarrito(){
  window.location.href = "carrito.html";
}

updateCount();
</script>

</body>
</html>
