<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARRIBA MODA</title>

<style>
body {
  margin: 0;
  font-family: 'Helvetica Neue', Arial;
  background: #f8f8f8;
  color: #111;
}

/* HEADER */
header {
  padding: 20px;
  text-align: center;
  background: white;
  letter-spacing: 3px;
}

/* BANNER */
.banner {
  height: 60vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #eae7e1;
  font-size: 40px;
  font-weight: 300;
  letter-spacing: 4px;
}

/* SECCIONES */
.section {
  padding: 50px 20px;
}

.section h2 {
  text-align: center;
  margin-bottom: 40px;
  font-weight: 300;
}

/* GRID PRODUCTOS */
.grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 20px;
  max-width: 1000px;
  margin: auto;
}

.card {
  background: white;
  padding: 20px;
  border-radius: 10px;
  text-align: center;
}

.card h3 {
  font-weight: 400;
}

.card p {
  color: #777;
}

.card button {
  margin-top: 10px;
  padding: 10px 20px;
  border: none;
  background: black;
  color: white;
  cursor: pointer;
}

/* FOOTER */
footer {
  margin-top: 50px;
  background: white;
  padding: 30px;
  text-align: center;
}

iframe {
  width: 100%;
  height: 250px;
  border: none;
  border-radius: 10px;
}

/* RESPONSIVE */
@media (max-width: 768px) {
  .grid {
    grid-template-columns: 1fr;
  }
}
</style>

</head>

<body>

<header>
  ARRIBA MODA
</header>

<div class="banner">
  Own Your Style
</div>

<!-- NOVEDADES -->
<div class="section">
  <h2>NOVEDADES</h2>

  <div class="grid">
    <div class="card">
      <h3>Vestido Arena</h3>
      <p>$15000</p>
      <button onclick="comprar('Vestido Arena')">Comprar</button>
    </div>

    <div class="card">
      <h3>Top Blanco</h3>
      <p>$9000</p>
      <button onclick="comprar('Top Blanco')">Comprar</button>
    </div>

    <div class="card">
      <h3>Conjunto Beige</h3>
      <p>$20000</p>
      <button onclick="comprar('Conjunto Beige')">Comprar</button>
    </div>
  </div>
</div>

<!-- MÁS VENDIDOS -->
<div class="section">
  <h2>MÁS VENDIDOS</h2>

  <div class="grid">
    <div class="card">
      <h3>Vestido Negro</h3>
      <p>$17000</p>
      <button onclick="comprar('Vestido Negro')">Comprar</button>
    </div>

    <div class="card">
      <h3>Blazer Nude</h3>
      <p>$25000</p>
      <button onclick="comprar('Blazer Nude')">Comprar</button>
    </div>

    <div class="card">
      <h3>Pantalón Sastrero</h3>
      <p>$18000</p>
      <button onclick="comprar('Pantalón Sastrero')">Comprar</button>
    </div>
  </div>
</div>

<!-- FOOTER CON MAPA -->
<footer>
  <h3>Visitános</h3>
  <p>Concordia 525</p>

  <iframe 
    src="https://www.google.com/maps?q=Concordia+525&output=embed">
  </iframe>

  <p style="margin-top:20px;">© 2026 ARRIBA MODA</p>
</footer>

<script>
function comprar(producto) {
  let numero = "TU_NUMERO";

  let mensaje = `Hola quiero comprar: ${producto}`;
  let url = `https://wa.me/${numero}?text=${encodeURIComponent(mensaje)}`;

  window.open(url, "_blank");
}
</script>

</body>
</html>
