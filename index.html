<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARRIBA MODA</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Poppins:wght@300;400&display=swap" rel="stylesheet">

<style>
body {margin:0;font-family:'Poppins',sans-serif;background:#f5f5f5;}

/* HEADER */
header {
  position:absolute;
  width:100%;
  display:flex;
  justify-content:space-between;
  padding:20px 40px;
  color:white;
  z-index:2;
}

/* NAV */
nav a {
  margin:0 10px;
  color:white;
  text-decoration:none;
  font-size:14px;
}

/* CARRITO MINIMAL */
.cart {
  cursor:pointer;
  width:24px;
  height:24px;
  border:1px solid white;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:12px;
}

/* BANNER */
.banner {
  height:90vh;
  display:flex;
  align-items:center;
  background: url('banner.jpg') right center no-repeat;
  background-size:cover;
  position:relative;
}

.banner::before {
  content:"";
  position:absolute;
  width:60%;
  height:100%;
  background:linear-gradient(to right, rgba(0,0,0,0.85), transparent);
}

.banner-text {
  position:relative;
  color:white;
  padding-left:60px;
}

.banner-text h1 {
  font-family:'Playfair Display', serif;
  font-size:90px;
  line-height:0.9;
}

.banner-text span {color:#c2a383;}

/* SECCIONES */
.section {
  padding:60px 20px;
}

.section h2 {
  text-align:center;
  margin-bottom:40px;
  font-weight:300;
  letter-spacing:2px;
}

/* GRID */
.grid {
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:30px;
  max-width:1100px;
  margin:auto;
}

/* CARD */
.card {
  background:white;
  padding:15px;
  border-radius:12px;
  text-align:center;
}

/* COLORES */
.colors {display:flex;justify-content:center;gap:10px;margin:10px 0;}
.color {width:18px;height:18px;border-radius:50%;cursor:pointer;border:2px solid transparent;}
.negro{background:black;}
.blanco{background:white;border:1px solid #ccc;}
.gris{background:gray;}
.active{border:2px solid black;}

/* CANTIDAD */
.qty {display:flex;justify-content:center;gap:10px;}
.qty button {width:28px;height:28px;border:none;background:#eee;}

/* BOTON */
button {padding:10px;background:black;color:white;border:none;cursor:pointer;}

@media(max-width:768px){
.grid{grid-template-columns:1fr;}
.banner-text h1{font-size:50px;}
}
</style>
</head>

<body>

<header>
  <div>ARRIBA MODA</div>

  <!-- MENU -->
  <nav>
    <a href="#novedades">Novedades</a>
    <a href="#vendidos">Más vendidos</a>
  </nav>

  <div class="cart" onclick="irCarrito()">
    <span id="count">0</span>
  </div>
</header>

<!-- BANNER -->
<div class="banner">
  <div class="banner-text">
    <h1>OWN<br>YOUR<br><span>STYLE</span></h1>
  </div>
</div>

<!-- NOVEDADES -->
<div class="section" id="novedades">
<h2>NOVEDADES</h2>

<div class="grid">

<div class="card">
<h3>Remera Morley</h3>
<p>$12000</p>

<div class="colors" id="c1">
<div class="color negro active" onclick="sel(this,'c1')"></div>
<div class="color blanco" onclick="sel(this,'c1')"></div>
<div class="color gris" onclick="sel(this,'c1')"></div>
</div>

<div class="qty">
<button onclick="q('q1',-1)">-</button>
<span id="q1">1</span>
<button onclick="q('q1',1)">+</button>
</div>

<button onclick="add('Remera Morley',12000,'c1','q1')">Agregar</button>
</div>

<div class="card"></div>
<div class="card"></div>

</div>
</div>

<!-- MAS VENDIDOS -->
<div class="section" id="vendidos">
<h2>MÁS VENDIDOS</h2>

<div class="grid">
<div class="card"></div>
<div class="card"></div>
<div class="card"></div>
</div>
</div>

<script>
let cart = JSON.parse(localStorage.getItem("cart")) || [];

function update(){
document.getElementById("count").innerText = cart.length;
}

function sel(el,id){
document.querySelectorAll(`#${id} .color`).forEach(c=>c.classList.remove("active"));
el.classList.add("active");
}

function q(id,v){
let e=document.getElementById(id);
let n=parseInt(e.innerText);
n+=v;
if(n<1)n=1;
if(n>5)n=5;
e.innerText=n;
}

function add(n,p,cid,qid){
let cantidad=parseInt(document.getElementById(qid).innerText);
let color=document.querySelector(`#${cid} .active`).classList[1];

cart.push({nombre:n,precio:p,color,cantidad});
localStorage.setItem("cart",JSON.stringify(cart));
update();

alert("Agregado al carrito");
}

function irCarrito(){
window.location.href="carrito.html";
}

update();
</script>

</body>
</html>
