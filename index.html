<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARRIBA MODA</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Poppins:wght@300;400&display=swap" rel="stylesheet">

<style>
body {
  margin:0;
  font-family:'Poppins', sans-serif;
  background:#f5f5f5;
  color:#111;
}

/* HEADER */
header {
  position:absolute;
  width:100%;
  display:flex;
  justify-content:space-between;
  padding:20px 40px;
  color:white;
  z-index:2;
}

nav a {
  margin:0 15px;
  color:white;
  text-decoration:none;
  font-size:14px;
}

/* BANNER */
.banner {
  height:90vh;
  display:flex;
  align-items:center;
  background: url('banner.jpeg') right center/cover no-repeat;
  position:relative;
}

/* DEGRADADO OSCURO IZQUIERDA */
.banner::before {
  content:"";
  position:absolute;
  width:60%;
  height:100%;
  background: linear-gradient(to right, rgba(0,0,0,0.9), rgba(0,0,0,0));
  left:0;
  top:0;
}

/* TEXTO */
.banner-text {
  position:relative;
  z-index:2;
  color:white;
  padding-left:60px;
}

.banner-text h1 {
  font-family:'Playfair Display', serif;
  font-size:90px;
  line-height:0.9;
  margin:0;
}

.banner-text span {
  color:#c2a383;
}

.banner-text p {
  margin-top:20px;
  letter-spacing:3px;
  font-size:14px;
  color:#ccc;
}

/* SECCIONES */
.section {
  padding:60px 20px;
}

.section h2 {
  text-align:center;
  font-weight:300;
  letter-spacing:3px;
  margin-bottom:40px;
}

.grid {
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:30px;
  max-width:1100px;
  margin:auto;
}

.card {
  background:white;
  padding:15px;
  border-radius:10px;
}

.card img {
  width:100%;
  border-radius:10px;
}

button {
  width:100%;
  margin-top:10px;
  padding:12px;
  background:black;
  color:white;
  border:none;
}

/* FOOTER */
footer {
  margin-top:60px;
  padding:40px;
  text-align:center;
}

iframe {
  width:100%;
  height:250px;
  border:none;
  border-radius:10px;
}

/* RESPONSIVE */
@media(max-width:768px){
  .banner-text h1 {font-size:50px;}
  .grid {grid-template-columns:1fr;}
}
</style>
</head>

<body>

<header>
  <div>ARRIBA MODA</div>

  <nav>
    <a href="#">NOVEDADES</a>
    <a href="#">MÁS VENDIDOS</a>
  </nav>

  <div>🛒</div>
</header>

<!-- BANNER -->
<div class="banner">
  <div class="banner-text">
    <h1>OWN<br>YOUR<br><span>STYLE</span></h1>
    <p>SIMPLE. ELEGANTE. AUTÉNTICO.</p>
  </div>
</div>

<!-- PRODUCTOS -->
<div class="section">
<h2>NOVEDADES</h2>

<div class="grid">

<div class="card">
<img src="banner.jpg">
<h3>Remera Morley</h3>
<p>$12000</p>
<button>Agregar</button>
</div>

<div class="card"></div>
<div class="card"></div>

</div>
</div>

<footer>
<h3>VISITÁNOS</h3>
<p>Concordia 525</p>
<iframe src="https://www.google.com/maps?q=Concordia+525&output=embed"></iframe>
</footer>

</body>
</html>
