<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARRIBA MODA</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Poppins:wght@300;400&display=swap" rel="stylesheet">

<style>
body {margin:0;font-family:'Poppins',sans-serif;background:#f5f5f5;}

/* HEADER */
header {
  position:absolute;
  width:100%;
  display:flex;
  justify-content:space-between;
  padding:20px 40px;
  color:white;
}

/* BANNER FIX */
.banner {
  height:90vh;
  display:flex;
  align-items:center;
  background: url('banner.jpg') right center no-repeat;
  background-size:contain; /* 👈 clave para que no se corte */
  background-color:#2b2b2b;
}

.banner-text {
  color:white;
  padding-left:60px;
}

.banner-text h1 {
  font-family:'Playfair Display', serif;
  font-size:80px;
}

/* GRID */
.grid {
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:30px;
  padding:40px;
}

.card {
  background:white;
  padding:15px;
  border-radius:10px;
  text-align:center;
}

/* COLORES */
.colors {display:flex;justify-content:center;gap:10px;margin:10px 0;}
.color {width:18px;height:18px;border-radius:50%;cursor:pointer;}
.negro{background:black;}
.blanco{background:white;border:1px solid #ccc;}
.gris{background:gray;}
.active{border:2px solid black;}

/* CANTIDAD */
.qty {display:flex;justify-content:center;gap:10px;}
.qty button {width:30px;height:30px;}

/* BOTON */
button {padding:10px;background:black;color:white;border:none;}

.cart {cursor:pointer;}

</style>
</head>

<body>

<header>
  <div>ARRIBA MODA</div>
  <div class="cart" onclick="irCarrito()">🛒 (<span id="count">0</span>)</div>
</header>

<div class="banner">
  <div class="banner-text">
    <h1>OWN YOUR STYLE</h1>
  </div>
</div>

<div class="grid">

<div class="card">
<h3>Remera Morley</h3>
<p>$12000</p>

<div class="colors" id="c1">
<div class="color negro active" onclick="sel(this,'c1')"></div>
<div class="color blanco" onclick="sel(this,'c1')"></div>
<div class="color gris" onclick="sel(this,'c1')"></div>
</div>

<div class="qty">
<button onclick="q('q1',-1)">-</button>
<span id="q1">1</span>
<button onclick="q('q1',1)">+</button>
</div>

<button onclick="add('Remera Morley',12000,'c1','q1')">Agregar</button>
</div>

</div>

<script>
let cart = JSON.parse(localStorage.getItem("cart")) || [];

function update(){
document.getElementById("count").innerText = cart.length;
}

function sel(el,id){
document.querySelectorAll(`#${id} .color`).forEach(c=>c.classList.remove("active"));
el.classList.add("active");
}

function q(id,v){
let e=document.getElementById(id);
let n=parseInt(e.innerText);
n+=v;
if(n<1)n=1;
if(n>5)n=5;
e.innerText=n;
}

function add(n,p,cid,qid){
let cantidad=parseInt(document.getElementById(qid).innerText);
let color=document.querySelector(`#${cid} .active`).classList[1];

cart.push({nombre:n,precio:p,color,cantidad});
localStorage.setItem("cart",JSON.stringify(cart));
update();
alert("Agregado");
}

function irCarrito(){
window.location.href="carrito.html";
}

update();
</script>

</body>
</html>
